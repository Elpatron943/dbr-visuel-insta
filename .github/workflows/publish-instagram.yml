name: Publier les carrousels et réels Instagram validés

on:
  schedule:
    - cron: "*/15 * * * *"
  push:
    branches: [main]
    paths: ["instagram/**/post.json"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish-instagram
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: Instagram
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Publier ce qui est validé et arrivé à échéance
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
        run: node scripts/publish-instagram.mjs
      - name: Enregistrer les publications
        if: always()
        run: |
          git config user.name "dbr-visuel-insta-bot"
          git config user.email "actions@github.com"
          for f in instagram/*/published.json instagram/*/skipped.json; do [ -f "$f" ] && git add "$f"; done
          if ! git diff --cached --quiet; then
            git commit -m "Publications Instagram enregistrées"
            git pull --rebase origin main
            git push
          fi
