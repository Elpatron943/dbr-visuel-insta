name: Synchroniser et publier les réels préparés par Nora

# Va chercher toutes les 10 minutes, dans Supabase, les réels préparés par Nora
# (vidéo, couverture, post.json), les dépose dans instagram/<dossier>/, puis publie
# ce que Max a validé (approved true, publish_at passé). Aucune action manuelle.

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish-instagram
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    environment: Instagram
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Recopier les réels depuis Supabase
        run: |
          cat > "$RUNNER_TEMP/sync.mjs" <<'NORA_EOF'
          // Recopie dans le dépôt les réels et carrousels préparés par Nora dans Supabase (fonction public.dbr_reel_queue),
          // sans aucune action manuelle : vidéo et couverture téléchargées depuis leurs URL publiques (md5 vérifié),
          // post.json mis à jour à chaque changement (validation de Max : approved true + publish_at).
          // Un dossier déjà publié (published.json) ou écarté (skipped.json) n'est plus jamais modifié.
          // Données lues : uniquement ce qui est destiné à être publié (légende, URL publiques, md5). Aucun secret.
          import fs from "node:fs";
          import path from "node:path";
          import crypto from "node:crypto";

          const URL_RPC = "https://pxkzymnydcegwuslqtpo.supabase.co/rest/v1/rpc/dbr_reel_queue";
          // Clé publishable (publique par conception) : elle ne donne accès qu'à la fonction ci-dessus.
          const KEY = process.env.SUPABASE_PUBLISHABLE_KEY || "sb_publishable_hh_AHxESr-JaJQsXtGL2yA_xmIRbp0i";
          // Réels et carrousels. Les images d'un carrousel sont poussées dans le dépôt par Nora : seul post.json est recopié.
          const SAFE = /^(reel|carrousel)-\d{4}-\d{2}-\d{2}-[a-z0-9-]+$/;

          const md5 = (buf) => crypto.createHash("md5").update(buf).digest("hex");

          async function download(url, expectedMd5) {
            if (!/^https:\/\//.test(url)) throw new Error(`URL refusée : ${url}`);
            const r = await fetch(url);
            if (!r.ok) throw new Error(`téléchargement ${r.status} : ${url}`);
            const buf = Buffer.from(await r.arrayBuffer());
            if (expectedMd5 && md5(buf) !== expectedMd5) throw new Error(`md5 différent pour ${url}`);
            return buf;
          }

          async function loadQueue() {
            if (process.env.QUEUE_FILE) return JSON.parse(fs.readFileSync(process.env.QUEUE_FILE, "utf8"));
            const r = await fetch(URL_RPC, {
              method: "POST",
              headers: { apikey: KEY, Authorization: `Bearer ${KEY}`, "Content-Type": "application/json" },
              body: "{}",
            });
            if (!r.ok) throw new Error(`Supabase ${r.status} : ${await r.text()}`);
            return r.json();
          }

          const queue = await loadQueue();
          let changed = 0;
          for (const item of queue) {
            const { dossier, post, lisez_moi: lm } = item;
            if (!SAFE.test(dossier || "")) { console.log(`dossier ignoré : ${dossier}`); continue; }
            const dir = path.join("instagram", dossier);
            if (fs.existsSync(path.join(dir, "published.json")) || fs.existsSync(path.join(dir, "skipped.json"))) continue;
            try {
              if (dossier.startsWith("carrousel-")) {
                const manquantes = (post?.images || []).filter((f) => !fs.existsSync(path.join(dir, f)));
                if (!post?.images?.length || manquantes.length) {
                  console.log(`${dossier} : images absentes du dépôt (${manquantes.join(", ") || "aucune image"}), ignoré`);
                  continue;
                }
              }
              fs.mkdirSync(dir, { recursive: true });
              for (const name of ["reel.mp4", "cover.jpg"]) {
                const f = lm?.fichiers?.[name];
                const target = path.join(dir, name);
                if (!f?.url) continue;
                if (fs.existsSync(target) && (!f.md5 || md5(fs.readFileSync(target)) === f.md5)) continue;
                fs.writeFileSync(target, await download(f.url, f.md5));
                console.log(`${dossier} : ${name} déposé`);
                changed++;
              }
              const g = lm?.guide_cover;
              if (g?.url && g?.chemin_depot && /^guides\/[a-z0-9-]+\/cover\.png$/.test(g.chemin_depot) && !fs.existsSync(g.chemin_depot)) {
                fs.mkdirSync(path.dirname(g.chemin_depot), { recursive: true });
                fs.writeFileSync(g.chemin_depot, await download(g.url));
                console.log(`${dossier} : couverture du guide déposée`);
                changed++;
              }
              const pj = path.join(dir, "post.json");
              const next = JSON.stringify(post, null, 1) + "\n";
              if (!fs.existsSync(pj) || fs.readFileSync(pj, "utf8") !== next) {
                fs.writeFileSync(pj, next);
                console.log(`${dossier} : post.json à jour (approved=${post.approved}, publish_at=${post.publish_at})`);
                changed++;
              }
            } catch (e) {
              console.error(`${dossier} : ${e.message}`);
              process.exitCode = 1;
            }
          }
          console.log(`${changed} changement(s)`);
          NORA_EOF
          node "$RUNNER_TEMP/sync.mjs"
      - name: Publier ce qui est validé et arrivé à échéance
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
        run: node scripts/publish-instagram.mjs
      - name: Enregistrer
        if: always()
        run: |
          git config user.name "dbr-visuel-insta-bot"
          git config user.email "actions@github.com"
          git add instagram guides 2>/dev/null || true
          if ! git diff --cached --quiet; then
            git commit -m "Réels synchronisés depuis Supabase"
            git pull --rebase origin main && git push
          fi
