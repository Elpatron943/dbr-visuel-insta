name: Temporaire - images du carrousel du 28/10
on:
  push:
    branches: [claude/carrousel-2026-10-28-images]
    paths: [".github/workflows/tmp-carrousel-2026-10-28.yml"]
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Télécharger et vérifier les 8 JPEG
        run: |
          set -e
          D=instagram/carrousel-2026-11-04-grille-8-temps
          mkdir -p $D
          B=https://d3e0luujhwn38u.cloudfront.net/original/img/original/340977
          while read n f m; do
            curl -sSf -o $D/$n $B/$f.jpg
            echo "$m  $D/$n" | md5sum -c -
          done <<'LIST'
          01.jpg 44ed447e-105b-4fb8-bb4c-524c995db412 a79a9d035b5d4ebb5c4d3674aa41bc2e
          02.jpg 8644a8f9-c7a2-487d-909e-c82a7519c426 3e1935c5a95d1134c6f2f0d465758e6e
          03.jpg e7e25e3b-6869-49ef-92a5-f2a0b66ca0fb 2d493c075efcc243986667a2a4821e03
          04.jpg 690c7061-5e53-435f-b2e4-b90f350206b4 7f59e8868792daad7e936cf1e4eb4fe5
          05.jpg 9914b6a3-4f10-4f91-9d55-8d7ae9aebd61 a422cda5dff95847aa4a8aebc09dd410
          06.jpg 1648cfce-9556-43d5-9a33-5d06f24ae06c f576dd0080c0bded70d3ef24fe2eb3f1
          07.jpg 0dcc5696-0d33-4eb0-af61-eebe04697eb5 6044dbe25317fab9adeb4594ffeb9d18
          LIST
          git config user.name "dbr-visuel-insta-bot"
          git config user.email "actions@github.com"
          git add $D
          git commit -m "Images du carrousel du 04/11 (md5 vérifiés)"
          git push
